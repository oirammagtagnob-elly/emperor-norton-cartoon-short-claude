<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
const Q=new URLSearchParams(location.search);
const NOCAP=new URLSearchParams(location.search).get('nocap')=='1';let SHK=.4;
const SC=parseFloat(Q.get('sc')||'1'),W=720,H=1280,GY=880,INK='#1d1a2f',DUR=74.84;
const FONT='"DejaVu Sans","Liberation Sans",Arial,sans-serif';
const c=document.getElementById('c');c.width=W*SC;c.height=H*SC;
let g=c.getContext('2d');const off=document.createElement('canvas'),offg=off.getContext('2d');
function soft(fn,k=3){const w=Math.ceil(c.width/k),h=Math.ceil(c.height/k);if(off.width!==w){off.width=w;off.height=h}const m=g.getTransform();offg.setTransform(1,0,0,1,0,0);offg.clearRect(0,0,w,h);offg.setTransform(m.a/k,m.b/k,m.c/k,m.d/k,m.e/k,m.f/k);const og=g;g=offg;try{fn()}finally{g=og}g.save();g.setTransform(1,0,0,1,0,0);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(off,0,0,w,h,0,0,c.width,c.height);g.restore()}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const easeOut=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const s=1.70158;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const R=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const PALC=['#e8806f','#6fb1c9','#e8c24f','#7bbf7a','#a98bd0','#ef9e56'];
const PAL=['#f3b6b0','#a9d6e5','#f7dc8b','#b7e0b0','#d5b8e8','#f6c58f'];

/* ---------- caption timing, taken from the silences in the recording ---------- */
const CAP=[[0,1.51,'In 1859,'],[1.80,5.79,'a bankrupt man declared himself Emperor of the United States.'],[6.20,8.32,'And a whole city went along with it.'],[8.86,9.85,'San Francisco.'],[10.52,14.30,'Joshua Norton had just lost his fortune on a bad rice deal.'],[14.79,18.81,'So he walked into a newspaper office and handed over a proclamation.'],[19.40,20.63,'From now on, he said,'],[21.04,22.26,'he was Emperor.'],[22.99,24.91,'The editors printed it as a joke.'],[25.41,27.90,'Then the joke refused to die.'],[28.50,31.17,'Norton put on a blue uniform and a feathered hat,'],[31.45,34.02,'and strolled the streets inspecting his empire.'],[34.59,36.85,'His first decree abolished Congress.'],[37.38,38.72,'Congress didn\u2019t notice.'],[39.27,40.84,'So he printed his own money,'],[41.16,43.28,'and restaurants actually accepted it.'],[43.87,45.63,'Caf\u00e9s hung brass plaques:'],[45.98,47.59,'\u201cBy appointment to the Emperor.\u201d'],[48.17,49.63,'Even the police saluted.'],[50.25,52.74,'The census listed his job as Emperor.'],[53.26,53.60,'Why?'],[54.13,55.63,'Because he never hurt anyone.'],[56.06,57.16,'He only wanted dinner,'],[57.41,58.59,'and a little respect.'],[59.32,62.16,'In 1880, he collapsed on a rainy street.'],[62.76,64.12,'The newspaper headline read:'],[64.52,65.82,'\u201cThe King Is Dead.\u201d'],[66.44,67.94,'Thousands lined the road.'],[68.49,71.02,'Congress never obeyed a single order.'],[71.61,74.84,'But San Francisco gave him an emperor\u2019s funeral.']];

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){g.roundRect(x,y,w,h,r)}
function shape(fn,fill,lw=5,stroke=INK){g.beginPath();fn();if(fill){g.fillStyle=fill;g.fill()}if(lw){g.lineWidth=lw;g.strokeStyle=stroke;g.lineJoin='round';g.lineCap='round';g.stroke()}}
function txt(s,x,y,size,col='#fff',al='center',stroke=null,lw=8){g.font=`bold ${size}px ${FONT}`;g.textAlign=al;g.textBaseline='middle';if(stroke){g.lineWidth=lw;g.strokeStyle=stroke;g.lineJoin='round';g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}
function wrap(s,maxW,size){g.font=`bold ${size}px ${FONT}`;const w=s.split(' '),L=[];let cur='';for(const k of w){const tr=cur?cur+' '+k:k;if(g.measureText(tr).width>maxW&&cur){L.push(cur);cur=k}else cur=tr}L.push(cur);return L}
function cam(fx,fy,z){g.save();g.translate(W/2,H/2);g.scale(z,z);g.translate(-fx,-fy)}
function uncam(){g.restore()}
function sky(a,b){const gr=g.createLinearGradient(0,-100,0,GY+60);gr.addColorStop(0,a);gr.addColorStop(1,b);g.fillStyle=gr;g.fillRect(-400,-400,W+800,H+800)}
function hills(...a){soft(()=>hills0(...a),3)}
function hills0(base,col,amp,off,seed,sc=0.006){g.beginPath();g.moveTo(-400,H+400);for(let x=-400;x<=W+400;x+=20){const y=base-amp*(Math.sin((x+off)*sc+seed)+.5*Math.sin((x+off)*sc*2.7+seed*2));g.lineTo(x,y)}g.lineTo(W+400,H+400);g.closePath();g.fillStyle=col;g.fill()}
function ground(y,c1,c2,off=0){g.fillStyle=c1;g.fillRect(-400,y,W+800,H+400-y);g.fillStyle=c2;for(let r=0;r<9;r++){for(let i=-3;i<14;i++){const xx=i*70+(r%2)*35+((off%70)+70)%70,yy=y+22+r*46;g.beginPath();g.ellipse(xx,yy,28,10,0,0,7);g.fill()}}const ao=g.createLinearGradient(0,y,0,y+70);ao.addColorStop(0,'rgba(20,10,30,.30)');ao.addColorStop(1,'rgba(20,10,30,0)');g.fillStyle=ao;g.fillRect(-400,y,W+800,70);g.strokeStyle=INK;g.lineWidth=5;g.beginPath();g.moveTo(-400,y);g.lineTo(W+400,y);g.stroke()}
function house(x,yb,w,h,col,roof){shape(()=>g.rect(x,yb-h,w,h),col,4);shape(()=>{g.moveTo(x-8,yb-h);g.lineTo(x+w/2,yb-h-w*.42);g.lineTo(x+w+8,yb-h);g.closePath()},roof,4);const cols=Math.max(1,Math.floor(w/60)),rows=Math.max(1,Math.floor((h-80)/70));for(let r=0;r<rows;r++)for(let i=0;i<cols;i++){const wx=x+(w/cols)*(i+.5)-14,wy=yb-h+24+r*70;shape(()=>rr(wx,wy,28,40,6),'#fff3c4',3)}shape(()=>rr(x+w/2-16,yb-52,32,52,8),'#7a4b3a',3)}
function row(...a){soft(()=>row0(...a),2)}
function row0(yb,off,seed,dark=0){const n=12;for(let i=0;i<n;i++){const x=(((i*150+off)%(n*150))+n*150)%(n*150)-300;const h=170+R(i+seed)*150,w=112+R(i*3+seed)*20;g.save();house(x,yb,w,h,PAL[Math.floor(R(i+seed*7)*6)],['#c0584c','#5b6fa8','#8a5a9c','#4f8a6b'][Math.floor(R(i*5+seed)*4)]);g.restore()}if(dark){g.fillStyle=`rgba(10,14,50,${dark})`;g.fillRect(-400,-400,W+800,yb+400)}
  // haze toward the horizon
  const hz=g.createLinearGradient(0,yb-260,0,yb);hz.addColorStop(0,'rgba(255,240,215,0)');hz.addColorStop(1,`rgba(255,240,215,${dark?.0:.2})`);g.fillStyle=hz;g.fillRect(-400,yb-260,W+800,260)}
function star(x,y,s,rot=0,col='#ffe36b'){g.save();g.translate(x,y);g.rotate(rot);shape(()=>{for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?s*.3:s;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath()},col,3);g.restore()}
function heart(x,y,s,col='#ef5b72'){g.save();g.translate(x,y);g.scale(s,s);shape(()=>{g.moveTo(0,10);g.bezierCurveTo(-30,-10,-18,-34,0,-16);g.bezierCurveTo(18,-34,30,-10,0,10)},col,3);g.restore()}
function crown(x,y,s){g.save();g.translate(x,y);g.scale(s,s);shape(()=>{g.moveTo(-50,0);g.lineTo(-58,-52);g.lineTo(-26,-26);g.lineTo(0,-64);g.lineTo(26,-26);g.lineTo(58,-52);g.lineTo(50,0);g.closePath()},'#ffd23f',5);[-58,0,58].forEach((q,i)=>shape(()=>g.arc(q,i==1?-68:-56,7,0,7),'#e8505b',3));g.restore()}
function rain(t,n,a=.5,sp=900){g.save();g.strokeStyle=`rgba(200,220,255,${a})`;g.lineWidth=3;for(let i=0;i<n;i++){const x=R(i)*(W+200)-100,y=((R(i+99)*H+t*sp*(.7+R(i+5)*.5))%(H+100))-50;g.beginPath();g.moveTo(x,y);g.lineTo(x-10,y+34);g.stroke()}g.restore()}
function paper(x,y,w,h,rot,fill='#fbf3da'){g.save();g.translate(x,y);g.rotate(rot);shape(()=>rr(-w/2,-h/2,w,h,6),fill,4);g.restore()}
function note(x,y,s,rot=0,a=1,word='IMPERIAL'){g.save();g.globalAlpha=a;g.translate(x,y);g.rotate(rot);g.scale(s,s);shape(()=>rr(-90,-48,180,96,8),'#cfe8b8',5);shape(()=>rr(-78,-36,156,72,5),null,2,'#4c7a4a');txt(word,0,-14,22,'#2f5a33');txt('SCRIP',0,14,22,'#2f5a33');txt('$',-62,0,22,'#2f5a33');txt('$',62,0,22,'#2f5a33');g.restore()}

/* ---------- characters: bean-head cast ---------- */
function person(x,y,s,o={}){
  o=Object.assign({coat:'#2f4f9a',skin:'#f4c9a3',pants:'#2b2a3a',flip:1,t:0,walk:0,armL:.15,armR:.15,hat:'none',mouth:'smile',epaulet:false,stache:false,plume:false,hair:'#6b4a33',look:0,shoe:'#1f1b2d',sweat:false,hold:null},o);
  g.save();g.translate(x,y);g.scale(s*o.flip,s);
  const sh=(ox,sx,a)=>{g.save();g.translate(ox,3);g.scale(sx,.2);const rg=g.createRadialGradient(0,0,2,0,0,80);rg.addColorStop(0,`rgba(25,12,35,${a})`);rg.addColorStop(1,'rgba(25,12,35,0)');g.fillStyle=rg;g.beginPath();g.arc(0,0,80,0,7);g.fill();g.restore()};
  sh(0,1.0,SHK);sh(52*o.flip,1.5,SHK*.6);
  const ph=o.t*9,bob=o.walk?-Math.abs(Math.sin(ph))*10:-Math.sin(o.t*2.2)*2.5;g.translate(0,bob);
  const sw=o.walk?Math.sin(ph)*18:0;
  shape(()=>rr(-36+sw,-64,28,64,10),o.pants,5);shape(()=>rr(8-sw,-64,28,64,10),o.pants,5);
  shape(()=>rr(-42+sw,-14,40,17,8),o.shoe,4);shape(()=>rr(2-sw,-14,40,17,8),o.shoe,4);
  shape(()=>rr(-54,-198,108,144,36),o.coat,5);
  g.save();g.beginPath();rr(-54,-198,108,144,36);g.clip();g.fillStyle='rgba(10,10,45,.22)';g.beginPath();g.ellipse(74,-118,66,112,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.ellipse(-62,-150,30,74,0,0,7);g.fill();g.fillStyle='rgba(10,10,45,.16)';g.fillRect(-54,-206,108,16);g.restore();
  if(o.epaulet){[-50,50].forEach(q=>{shape(()=>g.ellipse(q,-192,17,9,0,0,7),'#f1c232',3)});}
  [-160,-124,-88].forEach(q=>shape(()=>g.arc(0,q,6,0,7),o.epaulet?'#f1c232':'#e6e0d0',3));
  const hy=-262;
  shape(()=>g.ellipse(0,hy,64,68,0,0,7),o.skin,5);
  g.save();g.beginPath();g.ellipse(0,hy,62,66,0,0,7);g.clip();g.fillStyle='rgba(150,70,40,.17)';g.beginPath();g.ellipse(34,hy+12,60,72,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.28)';g.beginPath();g.ellipse(-28,hy-28,20,26,-.5,0,7);g.fill();g.restore();
  shape(()=>g.ellipse(-64,hy+6,10,14,0,0,7),o.skin,4);shape(()=>g.ellipse(64,hy+6,10,14,0,0,7),o.skin,4);
  g.fillStyle='rgba(240,120,120,.45)';g.beginPath();g.ellipse(-38,hy+22,12,8,0,0,7);g.ellipse(38,hy+22,12,8,0,0,7);g.fill();
  const bl=(o.t%3.3)>3.18,ey=hy-2,lx=o.look*6;
  [-23,23].forEach(q=>{if(bl){g.strokeStyle=INK;g.lineWidth=4;g.beginPath();g.moveTo(q-8+lx,ey);g.lineTo(q+8+lx,ey);g.stroke()}else{shape(()=>g.ellipse(q+lx,ey,8,10,0,0,7),'#1d1a2f',0);g.fillStyle='#fff';g.beginPath();g.arc(q+lx+3,ey-4,3,0,7);g.fill()}});
  if(o.stache){shape(()=>{g.moveTo(-34,hy+26);g.quadraticCurveTo(-20,hy+10,0,hy+22);g.quadraticCurveTo(20,hy+10,34,hy+26);g.quadraticCurveTo(18,hy+36,0,hy+28);g.quadraticCurveTo(-18,hy+36,-34,hy+26)},'#8a8a92',4)}
  const my=hy+(o.stache?40:30);g.strokeStyle=INK;g.lineWidth=4.5;g.lineCap='round';
  if(o.mouth=='smile'){g.beginPath();g.arc(0,my-8,17,.2,Math.PI-.2);g.stroke()}
  else if(o.mouth=='open'){shape(()=>g.ellipse(0,my+2,15,12+Math.abs(Math.sin(o.t*10))*4,0,0,7),'#7a2a3a',4)}
  else if(o.mouth=='o'){shape(()=>g.ellipse(0,my+2,9,11,0,0,7),'#7a2a3a',4)}
  else if(o.mouth=='flat'){g.beginPath();g.moveTo(-12,my);g.lineTo(12,my);g.stroke()}
  else if(o.mouth=='sad'){g.beginPath();g.arc(0,my+12,15,Math.PI+.3,-.3);g.stroke()}
  else if(o.mouth=='grin'){shape(()=>{g.moveTo(-20,my-6);g.quadraticCurveTo(0,my+26,20,my-6);g.closePath()},'#fff',4)}
  if(o.sweat){shape(()=>{g.moveTo(52,hy-34);g.quadraticCurveTo(62,hy-12,52,hy-8);g.quadraticCurveTo(42,hy-12,52,hy-34)},'#9fd8ff',3)}
  // hats / hair
  if(o.hat=='none'){shape(()=>{g.moveTo(-62,hy-14);g.quadraticCurveTo(-60,hy-70,0,hy-72);g.quadraticCurveTo(60,hy-70,62,hy-14);g.quadraticCurveTo(30,hy-44,-62,hy-14)},o.hair,4)}
  if(o.hat=='top'){shape(()=>rr(-54,hy-58,108,18,8),'#2b2a3a',5);shape(()=>rr(-36,hy-132,72,78,10),'#2b2a3a',5);shape(()=>rr(-36,hy-76,72,12,2),'#c0584c',3)}
  if(o.hat=='beaver'){shape(()=>rr(-60,hy-56,120,20,10),'#26356a',5);shape(()=>rr(-42,hy-106,84,58,22),'#2f4390',5);shape(()=>rr(-42,hy-72,84,12,2),'#f1c232',3);
    if(o.plume){shape(()=>{g.moveTo(26,hy-96);g.bezierCurveTo(70,hy-120,90,hy-170,62,hy-210);g.bezierCurveTo(70,hy-160,44,hy-130,20,hy-92)},'#34b37a',4);shape(()=>g.ellipse(64,hy-196,7,11,.5,0,7),'#f6d34a',3)}}
  if(o.hat=='cop'){shape(()=>{g.moveTo(-60,hy-34);g.quadraticCurveTo(-50,hy-118,0,hy-120);g.quadraticCurveTo(50,hy-118,60,hy-34);g.closePath()},'#27316b',5);shape(()=>rr(-66,hy-44,132,16,8),'#161c44',4);shape(()=>g.arc(0,hy-80,11,0,7),'#f1c232',3)}
  if(o.hat=='visor'){shape(()=>rr(-62,hy-52,124,18,8),'#2f8a5a',4);shape(()=>rr(-50,hy-34,100,6,2),'#2f8a5a',0)}
  if(o.hat=='bowler'){shape(()=>g.ellipse(0,hy-46,70,14,0,0,7),'#5a4030',5);shape(()=>{g.moveTo(-48,hy-48);g.quadraticCurveTo(-46,hy-110,0,hy-112);g.quadraticCurveTo(46,hy-110,48,hy-48);g.closePath()},'#6b4e38',5)}
  if(o.hat=='chef'){shape(()=>rr(-44,hy-80,88,40,14),'#fff',5);shape(()=>g.arc(-26,hy-90,24,0,7),'#fff',5);shape(()=>g.arc(26,hy-90,24,0,7),'#fff',5);shape(()=>g.arc(0,hy-104,26,0,7),'#fff',5);}
  // arms (drawn last so they read in front)
  const arm=(sx,rot)=>{g.save();g.translate(sx,-182);g.rotate(rot);shape(()=>rr(-13,-6,26,82,13),o.coat,5);shape(()=>g.arc(0,86,16,0,7),o.skin,4);g.restore()};
  arm(-56,o.armL);arm(56,-o.armR);
  g.restore();
}
function tiny(x,y,s,k,t,o={}){person(x,y,s,Object.assign({coat:PALC[k%6],pants:'#3a3550',hat:['none','top','bowler','none','visor','none'][k%6],hair:['#6b4a33','#2b2a3a','#c98f4a','#3a2a24'][k%4],t:t+k*.37,mouth:'smile'},o))}

/* ---------- scenes ---------- */
const NORTON={coat:'#2f4f9a',epaulet:true,hat:'beaver',plume:true,stache:true,skin:'#f1c29a'};
const SUIT={coat:'#7a5a44',epaulet:false,hat:'top',stache:true,skin:'#f1c29a',pants:'#3a3550'};

function sceneHook(lt,t){
  const e=easeOut(P(lt,0,5));cam(360,lerp(500,640,e),lerp(1.75,1,e));
  sky('#ffe3b3','#ffb487');
  g.save();g.translate(360,470);g.rotate(lt*.12);for(let i=0;i<16;i++){g.rotate(Math.PI/8);g.fillStyle='rgba(255,247,205,.38)';g.beginPath();g.moveTo(0,0);g.lineTo(1000,-70);g.lineTo(1000,70);g.fill()}g.restore();
  hills(760,'#f4b99d',80,0,1);row(GY-8,0,2);ground(GY,'#c99b72','#b88660');
  for(let k=0;k<10;k++){const side=k%2?1:-1,idx=Math.floor(k/2),pop=back(P(lt,6.2+k*.13,6.6+k*.13));if(pop<=0)continue;const x=360+side*(175+idx*58);g.save();g.translate(x,GY+(idx%2)*10);g.scale(pop,pop);g.translate(-x,-GY-(idx%2)*10);tiny(x,GY+(idx%2)*10,.78,k,lt,{armL:2.7+Math.sin(lt*9+k)*.35,armR:2.7+Math.cos(lt*9+k)*.35,mouth:'open'});g.restore()}
  const up=back(P(lt,2.0,2.7));
  person(360,GY,1.5,Object.assign({},NORTON,{t:lt,armR:lerp(.15,2.95,up),armL:.2,mouth:lt>2.2?'grin':'smile'}));
  if(lt>2.2){const b=back(P(lt,2.4,3.1));g.save();g.translate(500,330);g.scale(b,b);g.rotate(.08);shape(()=>rr(-120,-46,240,92,18),'#fff8e0',5);txt('EMPEROR',0,-14,36,'#b33a3a');txt('of the U.S.',0,22,26,'#1d1a2f');g.restore()}
  if(lt>6.3)for(let i=0;i<22;i++){const p=P(lt,6.3,8.6),x=R(i)*W,y=-40+((p*1.3+R(i+4))%1)*H*1.1;g.save();g.translate(x,y);g.rotate(lt*3+i);g.fillStyle=PALC[i%6];g.fillRect(-6,-3,12,6);g.restore()}
  uncam();
  const s=back(P(lt,.15,.55))*(1-P(lt,5.6,6.4));if(s>0){g.save();g.translate(360,190);g.rotate(-.1);g.scale(s,s);txt('1859',0,0,150,'#ffd23f',...['center',INK,16]);g.restore()}
}

function sceneDock(lt,t){
  if(lt<1.8){const p=P(lt,0,1.8);cam(360-p*40,640,1.05);sky('#bfe6ff','#fff0d0');hills(700,'#9ccf9b',120,0,2);hills(780,'#7fb88a',100,200,4);
    g.fillStyle='#5fb0d9';g.fillRect(-400,660,W+800,400);[0,1,2].forEach(i=>{const x=120+i*210+Math.sin(lt*1.5+i)*6,y=690+i*16;shape(()=>{g.moveTo(x-50,y);g.lineTo(x+50,y);g.lineTo(x+30,y+26);g.lineTo(x-30,y+26);g.closePath()},'#8a5a3c',4);shape(()=>{g.moveTo(x,y-110);g.lineTo(x+46,y-6);g.lineTo(x,y-6);g.closePath()},'#fff',4);shape(()=>{g.moveTo(x-6,y-90);g.lineTo(x-40,y-6);g.lineTo(x-6,y-6);g.closePath()},'#f2e9d0',4)});
    row(GY,-lt*20,3);uncam();const s=back(P(lt,.2,.7));g.save();g.translate(360,230);g.scale(s,s);shape(()=>rr(-250,-50,500,100,20),'#fff8e0',6);txt('SAN FRANCISCO',0,-8,48,'#1d1a2f');txt('GOLD-RUSH CITY',0,30,22,'#9a6a2f');g.restore();return}
  const l=lt-1.8;cam(360,640,1);sky('#fde2b6','#f6b98c');hills(700,'#e7a98f',70,0,5);
